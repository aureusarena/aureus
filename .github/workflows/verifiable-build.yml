name: Verifiable Build

on:
  workflow_dispatch:
  push:
    paths:
      - "program/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Solana Verify
        run: cargo install solana-verify --version 0.4.11

      - name: Verifiable Build
        run: solana-verify build --library-name aureus ${{ github.workspace }}/program

      - name: Get Executable Hash
        run: solana-verify get-executable-hash target/deploy/aureus.so

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: verifiable-build
          path: target/deploy/aureus.so
          retention-days: 14
